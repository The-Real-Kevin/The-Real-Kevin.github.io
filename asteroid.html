<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids - Yuqi Sun</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="site-theme.css">
    <link rel="stylesheet" href="asteroid.css">
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="asteroid-page">
    <header>
        <h1 data-i18n="ast_h1">Asteroids</h1>
    </header>
    <main>
        <h2 data-i18n="ast_h2">Maize and Blue Asteroids</h2>
        <p data-i18n="ast_instr">Use <strong>W / ↑</strong> to thrust, <strong>A/D / ← →</strong> to steer, and hold <strong>Spacebar</strong> to fire. On mobile, hold the buttons below—you can steer, thrust, and fire together. Destroy asteroids to earn points!</p>
        <p><strong><span data-i18n="ast_score">Score:</span> <span id="score">0</span></strong></p>
        <div class="game-stage">
            <canvas id="gameCanvas" width="1080" height="648" aria-label="Asteroids game" data-i18n-aria-label="ast_game"></canvas>
        </div>
        <div class="asteroid-controls" role="group" aria-label="Touch controls" data-i18n-aria-label="ast_controls">
            <button type="button" data-control="left" aria-pressed="false" data-i18n="ast_left">Left</button>
            <button type="button" data-control="right" aria-pressed="false" data-i18n="ast_right">Right</button>
            <button type="button" data-control="thrust" aria-pressed="false" data-i18n="ast_thrust">Thrust</button>
            <button type="button" data-control="fire" aria-pressed="false" data-i18n="ast_fire">Fire</button>
        </div>
    </main>
    <footer>
        <div class="footer-bar">
            <a href="mailto:yuqisun@umich.edu">Email: yuqisun@umich.edu</a>
            <a href="https://www.linkedin.com/in/kevinsunyuqi" target="_blank">LinkedIn</a>
            <a href="https://www.youtube.com/@the_real_kevin8996" target="_blank">YouTube</a>
            <a href="https://yuqisun-blog-umich.tumblr.com/" target="_blank">Blog</a>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Game variables
        const ship = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            angle: Math.PI / 2,
            rotation: 0,
            thrusting: false,
            thrust: { x: 0, y: 0 },
            speed: 0.1
        };

        let asteroids = [];
        let bullets = [];
        let score = 0;
        let fireCooldown = 0;
        let invulnerableFrames = 120;
        const heldKeys = new Set();
        const touchPointers = new Map();
        const controlButtons = document.querySelectorAll("[data-control]");

        const FPS = 60;
        const ASTEROID_SIZE = 50;
        const ASTEROID_SPEED = 1;
        const ASTEROID_VERTICES = 10;
        const BULLET_SPEED = 5;
        const BULLET_LIFE = 30;
        // Retain about 91% of momentum after one second without thrust.
        const DRIFT_RETENTION = 0.9985;
        const MAX_SPEED = 8;

        // Event listeners
        document.addEventListener("keydown", keyDown);
        document.addEventListener("keyup", keyUp);
        window.addEventListener("blur", clearControls);
        document.addEventListener("visibilitychange", function () {
            if (document.hidden) clearControls();
        });
        window.addEventListener("resize", resizeGame);

        controlButtons.forEach(function (button) {
            button.addEventListener("pointerdown", function (event) {
                event.preventDefault();
                touchPointers.set(event.pointerId, button.dataset.control);
                button.setPointerCapture(event.pointerId);
                syncControls();
                if (button.dataset.control === "fire") shoot();
            });
            function release(event) {
                touchPointers.delete(event.pointerId);
                syncControls();
            }
            button.addEventListener("pointerup", release);
            button.addEventListener("pointercancel", release);
            button.addEventListener("lostpointercapture", release);
            button.addEventListener("click", function (event) {
                // Keyboard and assistive-technology activation still works.
                if (event.detail === 0 && button.dataset.control === "fire") shoot();
            });
        });

        // Initialize
        resizeGame();
        createAsteroidField();
        setInterval(update, 1000 / FPS);

        function resizeGame() {
            const oldWidth = canvas.width;
            const oldHeight = canvas.height;
            const width = Math.max(280, Math.min(1080, Math.floor(canvas.parentElement.clientWidth)));
            canvas.width = width;
            canvas.height = Math.round(width * (width < 600 ? 1.08 : 0.6));
            // Preserve positions during rotation/resizing rather than restarting.
            [ship, ...asteroids, ...bullets].forEach(function (object) {
                object.x *= canvas.width / oldWidth;
                object.y *= canvas.height / oldHeight;
            });
        }

        function controlHeld(action) {
            const keys = { left: ["a", "arrowleft"], right: ["d", "arrowright"],
                thrust: ["w", "arrowup"], fire: [" "] };
            return keys[action].some(key => heldKeys.has(key)) ||
                Array.from(touchPointers.values()).includes(action);
        }

        function syncControls() {
            ship.thrusting = controlHeld("thrust");
            ship.rotation = (Number(controlHeld("left")) - Number(controlHeld("right"))) * 0.075;
            controlButtons.forEach(function (button) {
                const active = controlHeld(button.dataset.control);
                button.classList.toggle("is-pressed", active);
                button.setAttribute("aria-pressed", String(active));
            });
        }

        function clearControls() {
            heldKeys.clear();
            touchPointers.clear();
            syncControls();
        }

        function respawnShip() {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.angle = Math.PI / 2;
            ship.thrust.x = 0;
            ship.thrust.y = 0;
            invulnerableFrames = 120;
            fireCooldown = 0;
            clearControls();
        }

        function shoot() {
            if (fireCooldown > 0) return;
            bullets.push({
                x: ship.x + ship.radius * Math.cos(ship.angle),
                y: ship.y - ship.radius * Math.sin(ship.angle),
                xv: BULLET_SPEED * Math.cos(ship.angle) + ship.thrust.x,
                yv: -BULLET_SPEED * Math.sin(ship.angle) + ship.thrust.y,
                life: BULLET_LIFE
            });
            fireCooldown = 8;
        }

        function createAsteroidField() {
            asteroids = [];
            for (let i = 0; i < 5; i++) {
                spawnAsteroidOnEdge();
            }
        }

        function spawnAsteroidOnEdge() {
            const side = Math.floor(Math.random() * 4); // 0: top, 1: right, 2: bottom, 3: left
            let x, y;

            switch (side) {
                case 0: // top
                    x = Math.random() * canvas.width;
                    y = -ASTEROID_SIZE;
                    break;
                case 1: // right
                    x = canvas.width + ASTEROID_SIZE;
                    y = Math.random() * canvas.height;
                    break;
                case 2: // bottom
                    x = Math.random() * canvas.width;
                    y = canvas.height + ASTEROID_SIZE;
                    break;
                case 3: // left
                    x = -ASTEROID_SIZE;
                    y = Math.random() * canvas.height;
                    break;
            }

            const angle = Math.random() * Math.PI * 2;
            const asteroid = {
                x,
                y,
                xv: (Math.random() * ASTEROID_SPEED * 2) - ASTEROID_SPEED,
                yv: (Math.random() * ASTEROID_SPEED * 2) - ASTEROID_SPEED,
                radius: ASTEROID_SIZE,
                angle,
                vertices: Math.floor(Math.random() * (ASTEROID_VERTICES + 1) + 5),
                offsets: []
            };

            for (let j = 0; j < asteroid.vertices; j++) {
                asteroid.offsets.push(Math.random() * 0.4 + 0.6);
            }

            asteroids.push(asteroid);
        }

        function drawShip() {
            ctx.save();
            // Pulse while protected without making the player disappear.
            if (invulnerableFrames > 0 && invulnerableFrames % 12 < 6) ctx.globalAlpha = 0.4;
            ctx.strokeStyle = "#FFCB05";
            ctx.lineWidth = 2;
            ctx.beginPath();

            const noseX = ship.x + ship.radius * Math.cos(ship.angle);
            const noseY = ship.y - ship.radius * Math.sin(ship.angle);
            const leftX = ship.x - ship.radius * Math.cos(ship.angle + 0.7);
            const leftY = ship.y + ship.radius * Math.sin(ship.angle + 0.7);
            const rightX = ship.x - ship.radius * Math.cos(ship.angle - 0.7);
            const rightY = ship.y + ship.radius * Math.sin(ship.angle - 0.7);

            ctx.moveTo(noseX, noseY);
            ctx.lineTo(leftX, leftY);
            ctx.lineTo(rightX, rightY);
            ctx.closePath();
            ctx.stroke();

            if (ship.thrusting) {
                ctx.beginPath();
                const tailX = ship.x - ship.radius * Math.cos(ship.angle);
                const tailY = ship.y + ship.radius * Math.sin(ship.angle);
                ctx.moveTo(leftX, leftY);
                ctx.lineTo(tailX, tailY);
                ctx.lineTo(rightX, rightY);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawAsteroids() {
            for (const asteroid of asteroids) {
                ctx.strokeStyle = "#FFCB05";
                ctx.lineWidth = 2;
                ctx.beginPath();

                for (let j = 0; j < asteroid.vertices; j++) {
                    const angle = asteroid.angle + j * Math.PI * 2 / asteroid.vertices;
                    const radius = asteroid.radius * asteroid.offsets[j];
                    const x = asteroid.x + radius * Math.cos(angle);
                    const y = asteroid.y + radius * Math.sin(angle);
                    if (j === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.stroke();
            }
        }

        function drawBullets() {
            ctx.fillStyle = "#FFCB05";
            for (const bullet of bullets) {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawScore() {
            ctx.fillStyle = "#FFCB05";
            ctx.font = "18px 'Courier New'";
            const label = document.querySelector('[data-i18n="ast_score"]').textContent;
            ctx.fillText(`${label} ${score}`, 10, 30);
        }

        function keyDown(e) {
            const key = e.key.toLowerCase();
            if (!["w", "a", "d", "arrowup", "arrowleft", "arrowright", " "].includes(key)) return;
            if (e.target.closest("input, textarea, select, #lang-selector, #theme-toggle")) return;
            e.preventDefault();
            heldKeys.add(key);
            syncControls();
            if (key === " " && !e.repeat) shoot();
        }

        function keyUp(e) {
            heldKeys.delete(e.key.toLowerCase());
            syncControls();
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (invulnerableFrames > 0) invulnerableFrames--;
            if (fireCooldown > 0) fireCooldown--;
            if (controlHeld("fire")) shoot();

            // Ship rotation & thrust
            ship.angle += ship.rotation;
            if (ship.thrusting) {
                ship.thrust.x += ship.speed * Math.cos(ship.angle);
                ship.thrust.y -= ship.speed * Math.sin(ship.angle);
            } else {
                ship.thrust.x *= DRIFT_RETENTION;
                ship.thrust.y *= DRIFT_RETENTION;
            }
            const speed = Math.hypot(ship.thrust.x, ship.thrust.y);
            if (speed > MAX_SPEED) {
                ship.thrust.x *= MAX_SPEED / speed;
                ship.thrust.y *= MAX_SPEED / speed;
            }

            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;

            // Wrap ship
            if (ship.x < 0) ship.x = canvas.width;
            if (ship.x > canvas.width) ship.x = 0;
            if (ship.y < 0) ship.y = canvas.height;
            if (ship.y > canvas.height) ship.y = 0;

            // Move asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.x += a.xv;
                a.y += a.yv;

                // Wrap asteroids
                if (a.x < -a.radius) a.x = canvas.width + a.radius;
                if (a.x > canvas.width + a.radius) a.x = -a.radius;
                if (a.y < -a.radius) a.y = canvas.height + a.radius;
                if (a.y > canvas.height + a.radius) a.y = -a.radius;

                // Collision with ship
                const dx = ship.x - a.x;
                const dy = ship.y - a.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (invulnerableFrames === 0 && dist < ship.radius + a.radius) {
                    createAsteroidField();
                    bullets = [];
                    score = 0;
                    scoreElement.textContent = score;
                    respawnShip();
                    break;
                }
            }

            // Move bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.xv;
                b.y += b.yv;

                // Wrap bullets
                if (b.x < 0) b.x = canvas.width;
                if (b.x > canvas.width) b.x = 0;
                if (b.y < 0) b.y = canvas.height;
                if (b.y > canvas.height) b.y = 0;

                b.life--;
                if (b.life <= 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Bullet-asteroid collision
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const a = asteroids[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < a.radius) {
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        score++;
                        scoreElement.textContent = score;
                        spawnAsteroidOnEdge(); // New asteroid spawns on edge
                        break;
                    }
                }
            }

            // Draw everything
            drawShip();
            drawAsteroids();
            drawBullets();
            drawScore();
        }
    </script>
</body>
</html>
