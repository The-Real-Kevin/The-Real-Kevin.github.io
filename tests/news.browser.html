<!doctype html>
<meta charset="utf-8">
<title>Shared news regression checks</title>
<pre id="results">RUNNING</pre>
<iframe id="home" style="width:1000px;height:800px;border:0"></iframe>
<iframe id="blog" style="width:1000px;height:800px;border:0"></iframe>
<script>
(async function () {
  const output = document.getElementById('results');
  const home = document.getElementById('home');
  const blog = document.getElementById('blog');
  const passed = [];
  window.testProgress = 'Loading both pages';
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  function check(value, message) { if (!value) throw Error(message); }
  function load(frame, path) {
    return new Promise(resolve => {
      frame.onload = () => resolve(frame.contentWindow);
      frame.src = '../' + path;
    });
  }
  try {
    localStorage.setItem('ks-lang', 'en');
    const [hw, bw] = await Promise.all([load(home, 'index.html'), load(blog, 'blog.html')]);
    const hd = hw.document, bd = bw.document;
    const track = hd.getElementById('gallery-track');
    const status = hd.getElementById('gallery-status');
    const toggle = hd.getElementById('gallery-toggle');
    const slides = Array.from(track.children);
    const articles = Array.from(bd.querySelectorAll('.blog-post'));
    const posts = hw.YuqiNewsData.posts.slice().sort((a,b) => b.sortDate.localeCompare(a.sortDate));
    check(slides.length === posts.length && articles.length === posts.length, 'Post counts mismatch');
    const multi = bd.querySelector('.news-image-carousel');
    multi.querySelector('.next').click();
    const activeImage = multi.querySelector('.carousel-image.active');
    check(multi.querySelector('.news-image-status').textContent === '2 / 3', 'Multi-image next failed');
    for (const lang of ['en', 'de', 'ct']) {
      hw.SiteI18n.setLanguage(lang);
      bw.SiteI18n.setLanguage(lang);
      posts.forEach((post, index) => {
        const slide = slides[index], article = articles[index];
        check(article.id === post.id, 'News order mismatch');
        check(slide === track.children[index], 'Language change replaced home slides');
        check(article === bd.getElementById(post.id), 'Language change replaced full articles');
        check(slide.querySelector('a').hash === '#' + article.id, 'Full post anchor mismatch');
        check(slide.querySelector('time').textContent === article.querySelector('time').textContent,
          'Localized dates mismatch');
        check(slide.querySelector('time').dateTime === post.sortDate, 'ISO date mismatch');
        const paragraphs = Array.from(article.querySelectorAll(':scope > p:not(.blog-date)'));
        check(paragraphs.length === post.paragraphs.length, 'Missing full post paragraph');
        const excerpt = paragraphs.map(p => p.textContent.replace(/\s+/g, ' ').trim()).join(' ');
        check(slide.querySelector('figcaption').textContent === excerpt, 'Excerpt/full text mismatch');
        check(slide.querySelector('img').getAttribute('src') === post.images[0].src, 'Cover image mismatch');
        check(article.querySelectorAll('img').length === post.images.length, 'Missing full post images');
        check(article.querySelector('h2').textContent.length > 0, 'Title missing');
      });
      check(activeImage === multi.querySelector('.carousel-image.active'), 'Translation reset selected image');
      check(toggle.title === toggle.textContent, 'Playback accessible label not synchronized');
      passed.push('PASS '+lang+': all posts, dates, image sets, text, anchors and live language switching match');
    }
    multi.querySelector('.prev').click();
    check(multi.querySelector('.news-image-status').textContent === '1 / 3', 'Multi-image previous failed');
    multi.querySelector('.prev').click();
    check(multi.querySelector('.news-image-status').textContent === '3 / 3', 'Multi-image wrap failed');
    // Test real six-second timing with no reduced-motion preference.
    check(!hw.matchMedia('(prefers-reduced-motion: reduce)').matches, 'Run this harness with no-preference');
    check(toggle.dataset.playing === 'true', 'Autoplay is not enabled by default');
    window.testProgress = 'Checking automatic advance';
    hd.querySelector('.gallery-section').scrollIntoView({block:'center'});
    await wait(6800);
    check(status.textContent === '2 / ' + posts.length, 'Autoplay did not advance after six seconds');
    toggle.click();
    const paused = status.textContent;
    window.testProgress = 'Checking pause';
    await wait(6500);
    check(status.textContent === paused && toggle.dataset.playing === 'false', 'Pause failed');
    toggle.click();
    track.focus({preventScroll:true});
    window.testProgress = 'Checking focus pause';
    await wait(6500);
    check(status.textContent === paused, 'Autoplay should pause while keyboard focus is in carousel');
    track.blur();
    window.testProgress = 'Checking focus resume';
    await wait(6800);
    check(status.textContent === '3 / ' + posts.length, 'Autoplay did not resume after focus left');
    track.dispatchEvent(new hw.KeyboardEvent('keydown', {key:'End',bubbles:true}));
    window.testProgress = 'Checking wrap';
    for (let attempt = 0; attempt < 60; attempt++) {
      if (Math.abs(slides.at(-1).getBoundingClientRect().left - track.getBoundingClientRect().left) < 2) break;
      await wait(50);
    }
    await wait(6800);
    check(status.textContent === '1 / ' + posts.length,
      'Autoplay did not wrap last to first: ' + status.textContent);
    hd.querySelector('header').scrollIntoView();
    window.testProgress = 'Checking offscreen pause';
    const offscreen = status.textContent;
    await wait(6500);
    check(status.textContent === offscreen, 'Offscreen carousel should pause');
    passed.push('PASS real timing: autoplay, pause/play, keyboard focus pause/resume, circular wrap, offscreen pause');
    // Reduced-motion preference is already covered by all 24 home checks.
    const hash = slides[4].querySelector('a').hash;
    window.testProgress = 'Checking direct post link ' + hash;
    await load(blog, 'blog.html?anchor-test=1' + hash);
    await wait(200);
    check(bw.document.getElementById(hash.slice(1)).getBoundingClientRect().top < 300,
      'Direct full-post link did not scroll to rendered article');
    passed.push('PASS direct post link lands on the matching full article');
    output.textContent = 'ALL PASSED\n' + passed.join('\n');
  } catch (error) {
    output.textContent = 'FAILED: ' + error.message + '\n' + passed.join('\n');
  }
})();
</script>
